# Generates an Alembic migration from model changes against a throwaway Postgres on
# GitHub's runners (ADR-0008: no local databases), then commits it to the branch.
name: db-autogenerate

on:
  workflow_dispatch:
    inputs:
      message:
        description: Migration message (slug)
        required: true

permissions:
  contents: write

jobs:
  autogenerate:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/aap
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic revision --autogenerate -m "${{ inputs.message }}"
      - run: ruff format migrations && ruff check --fix migrations || true
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/versions
          git commit -m "chore(db): autogenerate migration: ${{ inputs.message }}"
          git push
