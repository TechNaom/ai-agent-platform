name: Feature / story
description: A unit of planned work
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome does this deliver, and for whom?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions for "done".
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Design notes / links
