[project]
name = "ai-agent-platform"
version = "0.1.0"
description = "Multi-agent + multi-RAG platform and multi-channel content engine, with evals and observability."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs a PostgreSQL + pgvector database (DATABASE_URL)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
